name: Reentrenar

# Una vez por mes: baja el clima, reentrena con closures.csv + registrador y, si el modelo no empeora
# (ver app/ml/export.py) y los tests pasan, lo sube a main. Railway redespliega con el push.
on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: retrain

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ml.txt
      - run: pip install -r backend/requirements-ml.txt

      - name: Bajar clima (~15 min)
        working-directory: backend
        run: python -m scripts.download_weather

      - name: Entrenar y exportar
        working-directory: backend
        run: python -m app.ml.export

      - name: Tests
        run: pytest -q

      - name: Subir modelo a main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/model.json datasets/weather_observed.csv datasets/weather_forecast.csv
          git diff --cached --quiet && exit 0
          git commit -qm "Reentrenamiento automático $(date -u +%F)"
          git pull --rebase -q   # por si main avanzó durante los ~20 min del run
          git push
