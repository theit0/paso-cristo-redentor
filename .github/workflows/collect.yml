name: Registrador

on:
  schedule:
    - cron: "7 * * * *" # cada hora; GitHub puede demorar algunos minutos
  workflow_dispatch:

permissions:
  contents: write

concurrency: collect

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt

      - name: Recolectar
        working-directory: backend
        env:
          PASO_DATA_DIR: ${{ github.workspace }}/data
        run: python -m app.collect status mendoza

      - name: Guardar en rama data
        if: always() # guarda lo que se haya obtenido aunque una fuente falle
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "datos $(date -u +%FT%H:%MZ)"
          git push
